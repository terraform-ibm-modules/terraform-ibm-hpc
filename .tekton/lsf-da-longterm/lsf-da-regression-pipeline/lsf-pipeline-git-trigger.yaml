        - name: git-credentials-json-file
          value: $(params.git-credentials-json-file)
        - name: pipeline-debug
          value: $(params.pipeline-debug)
      workspaces:
        - name: output
          workspace: pipeline-ws
    - name: pre-requisites-install
      runAfter: [git-clone]
      taskRef:
        name: pre-requisites-install
      workspaces:
        - name: workspace
          workspace: pipeline-ws
      params:
        - name: pipeline-debug
          value: $(params.pipeline-debug)
        - name: repository
          value: $(params.repository)
    - name: ssh-key-creation
